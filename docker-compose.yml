services:
  nexus:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-dashboard:latest
    container_name: nexus-dashboard
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4020"
    ports:
      - "127.0.0.1:4020:4020"
    volumes:
      - nexus-data:/app/data
    networks:
      - tunnel
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4020/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tunnel:
    external: true
    name: cloudflared_default

volumes:
  nexus-data:
    name: nexus-data
