version: '3.8'

services:
  nexus:
    build: .
    container_name: nexus-dashboard
    ports:
      - "4020:4020"
    volumes:
      - nexus-data:/app/data
    environment:
      - NODE_ENV=production
      - JWT_SECRET=your-super-secret-jwt-key
      - PORT=4020
    restart: unless-stopped

volumes:
  nexus-data:
